# Check auto merge contiditons of PR and proceed merging
name: "Auto-merge in condition"

# Event on a comment (in PR)
on:
  issue_comment:
    types: [created]
jobs:
  # Check auto merge contiditons of PR and proceed merging
  automerge:
    # Apply this job if it is a PR and by OWNER with '/approve' comment
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve') }}

    # This job runs on Ubuntu-latest (Ubuntu 20.04 LTS checked on 2022-09-06)
    # See https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ubuntu-latest
    steps:
      # Check the commenter may actually merge here. This replaces the
      # '<repo>-maintainer' team lookup this repo used before, matching
      # kcloud-horizon and kcloud-magnum-ui.
      #
      # kcloud-cyborg-dashboard-maintainer still exists and its members still
      # pass: this endpoint resolves *effective* permission, which includes
      # permission granted through a team, so the team stays the way to grant
      # approval rights to someone who is not an org owner. What changes is
      # that org owners now pass too, and that the check verifies the
      # permission level rather than assuming the team carries write.
      - name: Verify if commenter has repo permission
        run: |
          USER="${{ github.event.comment.user.login }}"
          REPO="${{ github.event.repository.name }}"

          echo "USER: ${USER} / REPO: ${REPO}"

          STATUS=$(curl -s -o /tmp/permission.json -w "%{http_code}" -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CR_PAT_RWD }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/openKcloud/${REPO}/collaborators/${USER}/permission)

          cat /tmp/permission.json

          if [[ "$STATUS" != "200" ]]; then
            echo "User ${USER} is not a collaborator of repo ${REPO}"
            exit 1
          fi

          PERMISSION=$(jq -r '.permission' /tmp/permission.json)

          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "maintain" && "$PERMISSION" != "admin" ]]; then
            echo "User ${USER} does not have enough permission: ${PERMISSION}"
            exit 1
          fi

      # Apply 'approved' label when OWNER left '/approve' comment
      - uses: actions/checkout@v4
      - uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.github_token }}
          labels: |
            approved

      # AutoMerging if this PR has MERGE_LABELS: approved, lgtm (not wip, hold)
      - name: automerge-lgtm-approved
        uses: "pascalgn/automerge-action@v0.16.4"
        with:
          args: "--trace"
        env:
          GITHUB_TOKEN: "${{ secrets.CR_PAT_RWD }}"
          MERGE_LABELS: "approved,!wip,!hold"
          # Without this the action exits 0 even when the merge was rejected,
          # so the job shows green while the PR stays open and nothing says
          # why. Surfacing it matters here because CR_PAT_RWD cannot merge a PR
          # that touches .github/workflows/ unless it carries the 'workflow'
          # scope, and that failure is otherwise only visible in the log.
          MERGE_ERROR_FAIL: "true"
          MERGE_REMOVE_LABELS: ""
          MERGE_METHOD: "merge"
          MERGE_COMMIT_MESSAGE: "pull-request-title"
          MERGE_FORKS: "true"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"
          UPDATE_LABELS: "automerge"
          UPDATE_METHOD: "merge"
