name: Trigger Horizon image build

# kcloud-cyborg-dashboard ships as a Horizon plugin: it has no image of its own
# and is pip-installed into ghcr.io/openkcloud/kcloud-horizon at build time.
# README.rst documented how to wire the plugin into that build, but nothing
# actually rebuilt the image when this repo changed -- it had to be kicked off
# by hand. Ask kcloud-horizon to rebuild instead.
#
# The receiving side is kcloud-horizon's docker-build-and-push.yml, which
# listens for repository_dispatch type 'plugin-updated' and installs this repo
# from the kcloud/2024.1 branch.

on:
  push:
    branches: [ kcloud/2024.1 ]
  workflow_dispatch:

jobs:
  trigger-rebuild:
    # Forks carry neither the org secret nor a reason to rebuild the org image.
    if: github.repository_owner == 'openkcloud'

    runs-on: ubuntu-latest

    steps:
      - name: Request a kcloud-horizon rebuild
        env:
          # CR_PAT_RWD is the org-level PAT already used by auto-merge and by
          # the Horizon image build. It needs 'repo' scope for this API call.
          GH_TOKEN: ${{ secrets.CR_PAT_RWD }}
        run: |
          # --fail-with-body: without it curl exits 0 on 401/404 and the job
          # goes green while no build was ever queued.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/openkcloud/kcloud-horizon/dispatches \
            -d '{
                  "event_type": "plugin-updated",
                  "client_payload": {
                    "plugin": "${{ github.repository }}",
                    "ref": "${{ github.ref_name }}",
                    "sha": "${{ github.sha }}"
                  }
                }'
